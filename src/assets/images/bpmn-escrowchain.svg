<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" role="img" aria-labelledby="title description">
  <title id="title">Diagram BPMN Siklus Escrow EscrowChain</title>
  <desc id="description">Diagram swimlane proses pesanan EscrowChain untuk pembeli, penjual, escrow, admin atau tribunal, dan kurir. Kurir mengunggah foto paket di lokasi penerima; pembeli memeriksa bukti dan tetap mengonfirmasi penerimaan sebelum escrow diselesaikan.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/>
    </marker>
    <marker id="message-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .lane-label { fill: #cbd5e1; font-size: 17px; font-weight: 700; }
      .lane-sub { fill: #64748b; font-size: 12px; }
      .task { fill: #0f172a; stroke: #475569; stroke-width: 2; }
      .task-green { fill: #052e2b; stroke: #10b981; stroke-width: 2; }
      .task-amber { fill: #30210c; stroke: #f59e0b; stroke-width: 2; }
      .task-red { fill: #321519; stroke: #fb7185; stroke-width: 2; }
      .task-text { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .task-small { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
      .message { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#message-arrow); }
      .flow-label { fill: #94a3b8; font-size: 12px; }
      .gateway { fill: #0f172a; stroke: #fbbf24; stroke-width: 2.5; }
      .event { fill: #0f172a; stroke: #cbd5e1; stroke-width: 2.5; }
      .end-event { fill: #052e2b; stroke: #34d399; stroke-width: 4; }
      .end-refund { fill: #321519; stroke: #fb7185; stroke-width: 4; }
      .note { fill: #0b1220; stroke: #334155; stroke-width: 1.5; }
      .note-text { fill: #cbd5e1; font-size: 13px; }
    </style>
  </defs>

  <rect width="1920" height="1180" fill="#020617"/>
  <text x="70" y="58" class="title">BPMN · Siklus Pesanan EscrowChain</text>
  <text x="70" y="88" class="subtitle">Alur konseptual rekening bersama · Pembayaran SOL / AMN · Status dan transaksi masih berupa simulasi prototipe</text>
  <rect x="1530" y="35" width="320" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
  <circle cx="1553" cy="54" r="6" fill="#f59e0b"/>
  <text x="1570" y="59" class="subtitle">MODEL PROSES · BELUM ON-CHAIN</text>

  <!-- Pool and participant lanes -->
  <rect x="70" y="125" width="1780" height="1125" rx="12" fill="#080f1f" stroke="#475569" stroke-width="2"/>
  <rect x="70" y="125" width="205" height="225" fill="#0f172a"/>
  <rect x="70" y="350" width="205" height="225" fill="#111827"/>
  <rect x="70" y="575" width="205" height="225" fill="#0f172a"/>
  <rect x="70" y="800" width="205" height="225" fill="#111827"/>
  <rect x="70" y="1025" width="205" height="225" fill="#0f172a"/>
  <path d="M275 125 V1250 M70 350 H1850 M70 575 H1850 M70 800 H1850 M70 1025 H1850" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="228" class="lane-label">PEMBELI</text>
  <text x="95" y="252" class="lane-sub">Pemesan / penerima</text>
  <text x="95" y="453" class="lane-label">PENJUAL</text>
  <text x="95" y="477" class="lane-sub">UMKM / merchant</text>
  <text x="95" y="678" class="lane-label">ESCROWCHAIN</text>
  <text x="95" y="702" class="lane-sub">Akun escrow / vault</text>
  <text x="95" y="903" class="lane-label">ADMIN / TRIBUNAL</text>
  <text x="95" y="927" class="lane-sub">Resolusi sengketa</text>
  <text x="95" y="1128" class="lane-label">KURIR</text>
  <text x="95" y="1152" class="lane-sub">Pengantar paket</text>

  <!-- Normal order flow -->
  <circle cx="320" cy="235" r="18" class="event"/>
  <path d="M312 235h16 M320 227v16" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M338 235 H370" class="flow"/>
  <rect x="370" y="190" width="230" height="90" rx="12" class="task"/>
  <text x="485" y="222" class="task-text">Buat pesanan dan bayar</text>
  <text x="485" y="246" class="task-small">Checkout langsung atau bayar invoice</text>
  <text x="485" y="264" class="task-small">SOL / AMN · fee jaringan tetap SOL</text>

  <path d="M600 235 H650 V650 H710" class="flow"/>
  <rect x="710" y="605" width="235" height="90" rx="12" class="task-green"/>
  <text x="827" y="638" class="task-text">Kunci dana di escrow</text>
  <text x="827" y="662" class="task-small">Status: Funded · token pembayaran dipertahankan</text>
  <text x="827" y="680" class="task-small">Dana ditahan sampai pesanan diselesaikan</text>

  <path d="M945 650 H980 V462 H1010" class="flow"/>
  <rect x="1010" y="417" width="205" height="90" rx="12" class="task"/>
  <text x="1112" y="450" class="task-text">Konfirmasi pesanan</text>
  <text x="1112" y="474" class="task-small">Periksa ketersediaan barang</text>
  <text x="1112" y="492" class="task-small">Status: ConfirmedBySeller</text>

  <path d="M1215 462 H1290" class="flow"/>
  <polygon points="1320,432 1350,462 1320,492 1290,462" class="gateway"/>
  <text x="1320" y="467" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">X</text>
  <text x="1301" y="420" class="flow-label">Stok tersedia?</text>

  <path d="M1350 462 H1380" class="flow"/>
  <text x="1356" y="449" class="flow-label">Ya</text>
  <rect x="1380" y="417" width="205" height="90" rx="12" class="task"/>
  <text x="1482" y="450" class="task-text">Kirim barang</text>
  <text x="1482" y="474" class="task-small">Masukkan resi dan bukti pengiriman</text>
  <text x="1482" y="492" class="task-small">Status: Shipped</text>
  <path d="M1585 462 H1820 V1125 H1300" class="flow"/>
  <text x="1605" y="1108" class="flow-label">Paket diantar</text>
  <rect x="1000" y="1080" width="300" height="90" rx="12" class="task-amber"/>
  <text x="1150" y="1113" class="task-text">Kurir unggah foto tiba</text>
  <text x="1150" y="1137" class="task-small">Foto paket di depan pintu / lokasi</text>
  <text x="1150" y="1155" class="task-small">Catatan dan waktu pengantaran</text>
  <path d="M1000 1125 H940 V1070 H1820 V290 H1605 V235" class="flow"/>
  <text x="1530" y="1070" class="flow-label">Bukti terlihat oleh pembeli</text>

  <rect x="1370" y="190" width="235" height="90" rx="12" class="task"/>
  <text x="1487" y="223" class="task-text">Terima dan periksa barang</text>
  <text x="1487" y="247" class="task-small">Pembeli menilai kesesuaian pesanan</text>
  <text x="1487" y="265" class="task-small">Konfirmasi atau ajukan komplain</text>
  <path d="M1605 235 H1640" class="flow"/>
  <polygon points="1670,205 1700,235 1670,265 1640,235" class="gateway"/>
  <text x="1670" y="240" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">X</text>
  <text x="1642" y="192" class="flow-label">Sesuai?</text>

  <path d="M1700 235 H1760 V650 H1710" class="flow"/>
  <text x="1714" y="220" class="flow-label">Ya</text>
  <rect x="1470" y="605" width="240" height="90" rx="12" class="task-green"/>
  <text x="1590" y="638" class="task-text">Lepas dana ke penjual</text>
  <text x="1590" y="662" class="task-small">Pembayaran selesai · cashback AMN dikreditkan</text>
  <text x="1590" y="680" class="task-small">Cashback hanya pada penyelesaian ke penjual</text>
  <path d="M1710 650 H1760 V735" class="flow"/>
  <circle cx="1760" cy="760" r="19" class="end-event"/>
  <circle cx="1760" cy="760" r="12" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="1725" y="798" class="flow-label">COMPLETED</text>

  <!-- Unavailable stock branch -->
  <path d="M1320 492 V540 H1120 V605" class="flow"/>
  <text x="1332" y="519" class="flow-label">Tidak</text>
  <rect x="1000" y="605" width="240" height="90" rx="12" class="task-red"/>
  <text x="1120" y="638" class="task-text">Refund karena stok kosong</text>
  <text x="1120" y="662" class="task-small">Dana kembali ke pembeli</text>
  <text x="1120" y="680" class="task-small">dalam token pembayaran awal</text>
  <path d="M1120 695 V760 H1430" class="flow"/>
  <circle cx="1455" cy="760" r="19" class="end-refund"/>
  <circle cx="1455" cy="760" r="12" fill="none" stroke="#fb7185" stroke-width="2"/>
  <text x="1420" y="798" class="flow-label">REFUNDED</text>

  <!-- Dispute branch -->
  <path d="M1670 265 V315 H1585 V325" class="flow"/>
  <text x="1682" y="292" class="flow-label">Tidak</text>
  <rect x="1370" y="325" width="215" height="90" rx="12" class="task-amber"/>
  <text x="1477" y="358" class="task-text">Ajukan komplain</text>
  <text x="1477" y="382" class="task-small">Status: RefundRequested / Disputed</text>
  <text x="1477" y="400" class="task-small">Sertakan alasan dan bukti</text>
  <path d="M1477 415 V850 H1390" class="flow"/>
  <rect x="1130" y="835" width="260" height="95" rx="12" class="task-amber"/>
  <text x="1260" y="869" class="task-text">Tinjau bukti dan putuskan</text>
  <text x="1260" y="893" class="task-small">Admin / tribunal sesuai kuorum</text>
  <text x="1260" y="912" class="task-small">Alur keputusan masih simulasi</text>
  <path d="M1390 882 H1450" class="flow"/>
  <polygon points="1480,852 1510,882 1480,912 1450,882" class="gateway"/>
  <text x="1480" y="887" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">X</text>
  <text x="1420" y="942" class="flow-label">Putusan</text>
  <path d="M1510 882 H1575 V695" class="flow"/>
  <text x="1520" y="869" class="flow-label">Lepas</text>
  <path d="M1480 912 V965 H1455 V779" class="flow"/>
  <text x="1490" y="949" class="flow-label">Refund</text>

  <!-- Buyer-triggered timeout path -->
  <circle cx="910" cy="235" r="18" class="event"/>
  <circle cx="910" cy="235" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M910 226 V235 L917 239" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="910" y="202" class="flow-label" text-anchor="middle">Deadline terlewati</text>
  <path d="M910 253 V320 H740 V365" class="flow"/>
  <rect x="620" y="365" width="240" height="90" rx="12" class="task-amber"/>
  <text x="740" y="398" class="task-text">Pembeli klaim timeout</text>
  <text x="740" y="422" class="task-small">Hanya jika barang belum Shipped</text>
  <text x="740" y="440" class="task-small">Timeout bukan refund otomatis</text>
  <path d="M740 455 V540 H980 V650 H1000" class="flow"/>
  <text x="750" y="526" class="flow-label">Klaim valid sebelum pengiriman</text>

  <!-- BPMN notation and scope notes -->
  <rect x="85" y="1270" width="1765" height="100" rx="12" class="note"/>
  <text x="110" y="1300" fill="#f8fafc" font-size="14" font-weight="700">NOTASI &amp; BATASAN</text>
  <circle cx="285" cy="1296" r="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <text x="303" y="1301" class="note-text">Event</text>
  <rect x="375" y="1285" width="30" height="22" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="414" y="1301" class="note-text">Aktivitas</text>
  <polygon points="515,1284 527,1296 515,1308 503,1296" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="537" y="1301" class="note-text">Gateway eksklusif</text>
  <path d="M690 1296 H742" class="flow"/>
  <text x="753" y="1301" class="note-text">Alur urutan</text>
  <path d="M865 1296 H917" class="message"/>
  <text x="930" y="1301" class="note-text">Alur pesan</text>
  <text x="110" y="1340" class="note-text">Foto kurir adalah bukti pada prototipe, bukan verifikasi resmi ekspedisi atau bukti on-chain. Pembeli tetap mengonfirmasi penerimaan; escrow tidak dilepas otomatis. Refund memakai token pembayaran awal.</text>
</svg>
