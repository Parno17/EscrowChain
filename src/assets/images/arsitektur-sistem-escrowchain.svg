<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title description">
  <title id="title">Rancangan Arsitektur Sistem EscrowChain</title>
  <desc id="description">Diagram arsitektur yang membedakan prototipe React dengan portal kurir dan foto bukti pengantaran lokal, dari rancangan integrasi wallet, RPC Solana, program escrow Anchor, akun PDA, vault, penyimpanan foto off-chain, token AMN, serta resolusi sengketa.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/>
    </marker>
    <marker id="future-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#f59e0b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .section { fill: #cbd5e1; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #e2e8f0; font-size: 15px; font-weight: 650; text-anchor: middle; }
      .small { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
      .tiny { fill: #94a3b8; font-size: 11px; }
      .current-box { fill: #071b1a; stroke: #10b981; stroke-width: 2; }
      .current-node { fill: #0c2623; stroke: #34d399; stroke-width: 1.8; }
      .planned-box { fill: #171508; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 10 7; }
      .planned-node { fill: #231d0c; stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .neutral-node { fill: #0f172a; stroke: #475569; stroke-width: 1.8; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .planned-flow { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#future-arrow); stroke-linecap: round; stroke-linejoin: round; }
      .boundary { fill: #080f1f; stroke: #334155; stroke-width: 1.5; }
      .note { fill: #0b1220; stroke: #334155; stroke-width: 1.5; }
      .note-text { fill: #cbd5e1; font-size: 13px; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#020617"/>
  <text x="70" y="58" class="title">Rancangan Arsitektur Sistem EscrowChain</text>
  <text x="70" y="88" class="subtitle">Prototipe aplikasi rekening bersama untuk UMKM · Tampilan arsitektur saat ini dan target implementasi Solana</text>

  <rect x="70" y="120" width="1780" height="370" rx="16" class="current-box"/>
  <rect x="70" y="120" width="1780" height="58" rx="16" fill="#052e2b"/>
  <path d="M70 162 H1850" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="104" cy="149" r="7" fill="#34d399"/>
  <text x="124" y="155" class="section">A · PROTOTIPE SAAT INI — BERJALAN DI BROWSER, STATE DAN TRANSAKSI SIMULASI LOKAL</text>

  <!-- Users -->
  <rect x="105" y="235" width="190" height="94" rx="14" class="neutral-node"/>
  <text x="200" y="270" class="label">Pengguna</text>
  <text x="200" y="294" class="small">Pembeli · Penjual · Kurir</text>
  <text x="200" y="312" class="small">Admin · Arbiter (peran UI)</text>

  <path d="M295 282 H360" class="flow"/>
  <text x="327" y="269" class="tiny" text-anchor="middle">interaksi</text>

  <!-- Frontend boundary -->
  <rect x="360" y="205" width="760" height="242" rx="14" class="boundary"/>
  <text x="385" y="232" fill="#cbd5e1" font-size="14" font-weight="700">FRONTEND WEB · React + TypeScript</text>
  <rect x="390" y="260" width="210" height="78" rx="11" class="current-node"/>
  <text x="495" y="291" class="label">Portal &amp; UI</text>
  <text x="495" y="315" class="small">Buyer · Seller · Courier · Admin</text>
  <rect x="640" y="260" width="210" height="78" rx="11" class="current-node"/>
  <text x="745" y="291" class="label">Logika aplikasi</text>
  <text x="745" y="315" class="small">Context · status pesanan</text>
  <rect x="890" y="260" width="200" height="78" rx="11" class="current-node"/>
  <text x="990" y="291" class="label">Data simulasi</text>
  <text x="990" y="315" class="small">Mock data · bukti foto lokal</text>
  <path d="M600 299 H640" class="flow"/>
  <path d="M850 299 H890" class="flow"/>
  <path d="M990 338 V382 H495 V338" class="flow"/>
  <text x="744" y="403" class="small">Pembaruan tampilan dari state dalam aplikasi</text>
  <text x="495" y="363" class="tiny" text-anchor="middle">Komponen halaman</text>
  <text x="745" y="363" class="tiny" text-anchor="middle">Web3Context</text>
  <text x="990" y="363" class="tiny" text-anchor="middle">mockData.ts</text>

  <!-- Explicitly absent current services -->
  <rect x="1200" y="235" width="260" height="94" rx="14" class="neutral-node"/>
  <text x="1330" y="269" class="label">Belum terhubung</text>
  <text x="1330" y="293" class="small">Wallet signer · RPC · backend</text>
  <text x="1330" y="312" class="small">Program on-chain · SPL nyata</text>
  <path d="M1120 282 H1200" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M1155 272 L1171 292 M1171 272 L1155 292" stroke="#fb7185" stroke-width="3"/>

  <rect x="1490" y="235" width="315" height="94" rx="14" class="neutral-node"/>
  <text x="1647" y="269" class="label">Status implementasi</text>
  <text x="1647" y="293" class="small">UI memodelkan siklus escrow;</text>
  <text x="1647" y="312" class="small">aset belum dikunci di blockchain</text>

  <text x="106" y="460" class="tiny">Foto pengantaran disimpan pada state/localStorage browser; bukan verifikasi ekspedisi atau bukti on-chain. Status dan transaksi escrow tetap simulasi lokal.</text>

  <!-- Future architecture -->
  <rect x="70" y="520" width="1780" height="535" rx="16" class="planned-box"/>
  <rect x="70" y="520" width="1780" height="58" rx="16" fill="#29200b"/>
  <path d="M70 562 H1850" stroke="#d97706" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="104" cy="549" r="7" fill="#f59e0b"/>
  <text x="124" y="555" class="section">B · TARGET RANCANGAN — BELUM DIIMPLEMENTASIKAN / DI-DEPLOY</text>

  <!-- Client, wallet, and RPC -->
  <rect x="105" y="630" width="240" height="92" rx="13" class="planned-node"/>
  <text x="225" y="665" class="label">Aplikasi web</text>
  <text x="225" y="689" class="small">Instruksi &amp; status transaksi</text>
  <text x="225" y="707" class="small">validasi di sisi klien</text>

  <rect x="405" y="630" width="255" height="92" rx="13" class="planned-node"/>
  <text x="532" y="665" class="label">Wallet pengguna</text>
  <text x="532" y="689" class="small">Phantom · Solflare · Backpack</text>
  <text x="532" y="707" class="small">review dan tanda tangan transaksi</text>

  <rect x="720" y="630" width="220" height="92" rx="13" class="planned-node"/>
  <text x="830" y="665" class="label">Solana RPC</text>
  <text x="830" y="689" class="small">kirim instruksi / baca akun</text>
  <text x="830" y="707" class="small">pantau status &amp; konfirmasi</text>
  <path d="M345 676 H405" class="planned-flow"/>
  <path d="M660 676 H720" class="planned-flow"/>

  <!-- On-chain boundary -->
  <rect x="990" y="605" width="820" height="310" rx="16" class="boundary" stroke="#d97706" stroke-dasharray="8 6"/>
  <text x="1018" y="635" fill="#fbbf24" font-size="15" font-weight="700">SOLANA CLUSTER · PROGRAM DAN AKUN ON-CHAIN</text>
  <path d="M940 676 H990" class="planned-flow"/>

  <rect x="1030" y="670" width="320" height="100" rx="12" class="planned-node"/>
  <text x="1190" y="705" class="label">Program escrow (Anchor)</text>
  <text x="1190" y="729" class="small">aturan otorisasi dan state machine</text>
  <text x="1190" y="748" class="small">fund · ship · settle · refund · dispute</text>

  <rect x="1400" y="660" width="175" height="82" rx="12" class="planned-node"/>
  <text x="1487" y="694" class="label">Escrow PDA</text>
  <text x="1487" y="718" class="small">data pesanan &amp; status</text>
  <rect x="1600" y="660" width="175" height="82" rx="12" class="planned-node"/>
  <text x="1687" y="694" class="label">Vault PDA</text>
  <text x="1687" y="718" class="small">dana ditahan</text>
  <path d="M1350 710 H1400" class="planned-flow"/>
  <path d="M1350 744 H1374 V795 H1600 V742" class="planned-flow"/>

  <rect x="1060" y="815" width="285" height="70" rx="12" class="planned-node"/>
  <text x="1202" y="845" class="label">SOL / akun token SPL</text>
  <text x="1202" y="868" class="small">deposit, pembayaran, refund, settlement</text>
  <rect x="1400" y="815" width="175" height="70" rx="12" class="planned-node"/>
  <text x="1487" y="845" class="label">Mint AMN</text>
  <text x="1487" y="868" class="small">token SPL yang sah</text>
  <path d="M1687 742 V780 H1202 V815" class="planned-flow"/>
  <path d="M1487 815 V780 H1270 V770" class="planned-flow"/>
  <path d="M1487 815 V780 H1687 V742" class="planned-flow"/>

  <!-- Off-chain supporting services -->
  <rect x="105" y="810" width="300" height="92" rx="13" class="planned-node"/>
  <text x="255" y="845" class="label">App kurir / API ekspedisi</text>
  <text x="255" y="869" class="small">ambil dan kirim foto bukti pengantaran</text>
  <text x="255" y="887" class="small">integrasi resmi dan penugasan resi diperlukan</text>
  <path d="M225 810 V760 H225 V722" class="planned-flow"/>
  <text x="236" y="778" class="tiny">akses kurir</text>
  <rect x="475" y="810" width="365" height="92" rx="13" class="planned-node"/>
  <text x="657" y="845" class="label">Admin / Tribunal</text>
  <text x="657" y="869" class="small">review komplain · keputusan sesuai kebijakan</text>
  <text x="657" y="887" class="small">multisig / kuorum perlu dirancang</text>
  <path d="M840 856 H965 V770 H1030" class="planned-flow"/>
  <text x="910" y="842" class="tiny" text-anchor="middle">otorisasi terbatas</text>

  <rect x="1030" y="935" width="300" height="82" rx="12" class="planned-node"/>
  <text x="1180" y="966" class="label">Penyimpanan bukti foto</text>
  <text x="1180" y="989" class="small">off-chain · akses privat · retensi terbatas</text>
  <text x="1180" y="1006" class="small">hash/ref opsional; tidak membuktikan isi foto</text>
  <path d="M255 902 V970 H1030" class="planned-flow"/>
  <path d="M1330 976 H1400" class="planned-flow"/>
  <rect x="1400" y="935" width="375" height="82" rx="12" class="planned-node"/>
  <text x="1587" y="966" class="label">Pembeli periksa foto &amp; paket</text>
  <text x="1587" y="989" class="small">foto membantu, bukan bukti serah-terima pasti</text>
  <text x="1587" y="1006" class="small">pembeli konfirmasi → baru settle escrow</text>

  <!-- Interactions legend -->
  <rect x="70" y="1080" width="1780" height="80" rx="13" class="note"/>
  <rect x="100" y="1102" width="22" height="18" rx="4" fill="#0c2623" stroke="#34d399" stroke-width="1.5"/>
  <text x="135" y="1116" class="note-text">Tersedia pada prototipe (simulasi lokal)</text>
  <rect x="435" y="1102" width="22" height="18" rx="4" fill="#231d0c" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="470" y="1116" class="note-text">Komponen target / belum tersedia</text>
  <path d="M770 1111 H830" class="flow"/>
  <text x="842" y="1116" class="note-text">Alur data / interaksi</text>
  <path d="M1010 1111 H1070" class="planned-flow"/>
  <text x="1082" y="1116" class="note-text">Integrasi yang direncanakan</text>
  <text x="100" y="1143" class="tiny">Integrasi ekspedisi perlu API dan otorisasi resmi. Foto disimpan off-chain dengan kontrol akses; kurir tidak boleh melepas dana—pembeli tetap memeriksa dan mengonfirmasi. Yield vault belum aktif.</text>
</svg>
